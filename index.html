<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شجرة عشائر الحمودي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&family=Almarai:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f5ead8;color:#201e1d;font-family:'Almarai',system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.7}
  a{color:#8c491a}
  a:hover{color:#6f3712}
  .page{max-width:720px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
  h1,h2{font-family:'Rakkas',serif;font-weight:400;margin:0;line-height:1.3}
  h1{font-size:34px}
  .big{font-size:40px}
  .muted{color:#645c50;font-size:16px}
  .box{background:#ebddc5;border:2px solid #dcd3c4;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .white{background:#f9f4ed}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:12px 20px;border-radius:20px;border:2px solid #ffe1d0;background:#fff2eb;color:#8c491a;font-family:'Almarai';font-size:20px;font-weight:800;cursor:pointer;text-align:right}
  .btn:hover{filter:brightness(.97)}
  .btn small{font-size:15px;font-weight:700;color:#645c50;white-space:nowrap}
  .btn.main{background:#c67139;border-color:#b2622d;color:#fff2eb;justify-content:center}
  .btn.main:hover{background:#b2622d}
  .btn.sage{background:#e1eecc;border-color:#ccdbb2;color:#3d472b}
  .btn.plain{background:#f9f4ed;border-color:#dcd3c4;color:#474238}
  .btn.center{justify-content:center}
  :focus-visible{outline:3px solid #c67139;outline-offset:2px}
  input,textarea{width:100%;min-height:56px;padding:12px 18px;border-radius:18px;border:2px solid #dcd3c4;background:#fff;font-family:'Almarai';font-size:19px;color:#201e1d}
  textarea{min-height:110px;line-height:1.7;resize:vertical}
  label{font-weight:800;font-size:17px;color:#474238}
  .list{display:flex;flex-direction:column;gap:10px}
  .top{display:flex;gap:10px;flex-wrap:wrap}
  .top .btn{width:auto;flex:1 1 auto;min-height:52px;font-size:18px;justify-content:center}
  .facts{display:flex;flex-direction:column;gap:6px;font-size:18px}
  .facts div{display:flex;gap:8px;flex-wrap:wrap}
  .facts b{color:#474238}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:999px;background:#fff2eb;border:2px solid #ffe1d0;color:#8c491a;font-weight:800;text-decoration:none}
  .note{background:#f9f4ed;border:2px solid #dcd3c4;border-radius:18px;padding:12px 16px}
  .note.admin{background:#e1eecc;border-color:#ccdbb2}
  .note p{margin:0;white-space:pre-wrap}
  .note .who{font-size:14px;color:#645c50;font-weight:700;margin-top:4px}
  .ok{background:#e1eecc;border:2px solid #ccdbb2;color:#3d472b;border-radius:20px;padding:18px;font-size:20px;font-weight:800;text-align:center}
  .err{color:#8c491a;font-weight:800}
  .row2{display:flex;gap:8px;align-items:center}
  .row2 input{flex:1 1 auto}
  .x{flex:0 0 52px;min-height:52px;border-radius:16px;border:2px solid #dcd3c4;background:#f9f4ed;font-size:22px;cursor:pointer;color:#474238}
  .sub{padding-inline-start:26px;display:flex;flex-direction:column;gap:8px}
  .link{background:none;border:none;color:#8c491a;font-family:'Almarai';font-size:17px;font-weight:800;text-decoration:underline;cursor:pointer;padding:8px 0;text-align:right;min-height:44px;display:inline-flex;align-items:center}
  .foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;text-align:center;line-height:1.5}
  .foot a{display:inline-flex;align-items:center;min-height:44px;font-weight:800}
  ::placeholder{color:#a8a092;opacity:1}
  img.photo{width:120px;height:120px;object-fit:cover;border-radius:999px;border:3px solid #dcd3c4}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="page" id="app">
  <p class="muted" style="text-align:center">جارٍ تحميل الشجرة…</p>
</div>

<script>
var TREE_URL='https://raw.githubusercontent.com/alhamoudi-family/alhamoudi-family.github.io/main/tree.json';
var DATA_URL='https://raw.githubusercontent.com/alhamoudi-family/alhamoudi-family.github.io/main/data.json';
var HOOK_URL='https://baytalqasid.app.n8n.cloud/webhook/family-tree-note';
var PRIV_URL='https://baytalqasid.app.n8n.cloud/webhook/family-tree-private';
var PHONE_RE=/[0-9\u0660-\u0669+][0-9\u0660-\u0669+\s-]{6,}/g;

var app=document.getElementById('app');
var ROOT=null,index=[],byPath={},A={};
var sel='',query='',form=null,sent=false,kids=[{name:'',kids:[]}],phoneEdit=false;

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function btn(cls,txt,fn,sub){var b=el('button','btn '+(cls||''));b.type='button';b.appendChild(el('span',null,txt));if(sub!=null)b.appendChild(el('small',null,sub));b.onclick=fn;return b}
function nz(s){return String(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim()}
function kidsOf(r){return r.kids.map(function(k){return byPath[r.path+' / '+k.name]})}
function lineage(r,max){var c=r.chain.slice().reverse();if(max&&c.length>max)c=c.slice(0,max);return c.length?'ابن '+c.join(' بن '):''}

function build(t){
  index=[];byPath={};
  (function walk(node,parent,chain){
    var path=parent?parent+' / '+node.name:node.name;
    var rec={name:node.name,path:path,chain:chain,kids:node.kids||[],depth:chain.length};
    index.push(rec);byPath[path]=rec;
    rec.kids.forEach(function(k){walk(k,path,chain.concat(node.name))});
  })(t,'',[]);
  ROOT=index[0];
  index.slice().reverse().forEach(function(r){r.total=r.kids.reduce(function(s,k){return s+1+(byPath[r.path+' / '+k.name].total||0)},0)});
}

function search(q){
  var words=nz(q).split(' ').filter(function(w){return w&&w!=='بن'&&w!=='ابن'});
  if(!words.length)return [];
  return index.filter(function(r){
    if(r.depth<2)return false;
    var line=[r.name].concat(r.chain.slice().reverse()).map(nz);
    for(var i=0;i<words.length;i++){
      var p=line[i]||'',last=i===words.length-1;
      if(!(p===words[i]||(last&&p.indexOf(words[i])===0)||p.split(' ').indexOf(words[i])!==-1))return false;
    }
    return true;
  }).slice(0,40);
}

function go(path){sel=path;form=null;sent=false;kids=[{name:'',kids:[]}];try{history.pushState(null,'','#'+encodeURIComponent(path))}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('popstate',function(){var h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}sel=byPath[h]?h:ROOT.path;form=null;sent=false;render()});

function render(){
  app.innerHTML='';
  var r=byPath[sel]||ROOT;
  if(r===ROOT)home();else person(r);
  var f=el('div','foot');
  var full=el('a',null,'عرض الشجرة كاملة (للحاسوب)');full.href='full.html#'+encodeURIComponent(r.path);
  f.appendChild(full);
  f.appendChild(el('div','muted','إعداد الشجرة: علي لازم صخي'));
  app.appendChild(f);
}

function home(){
  var head=el('div');head.style.textAlign='center';
  head.appendChild(el('div','muted','قبيلة بني مالك — آل إبراهيم'));
  head.appendChild(el('h1','big','شجرة عشائر الحمودي'));
  app.appendChild(head);

  var sb=el('div','box white');
  sb.appendChild(el('label',null,'ابحث عن اسمك'));
  var inp=document.createElement('input');inp.type='search';inp.placeholder='مثال: اكرم علي لازم';inp.value=query;
  sb.appendChild(inp);
  sb.appendChild(el('div','muted','اكتب اسمك ثم اسم أبيك ثم جدك، لتجد نفسك بسرعة.'));
  var res=el('div','list');sb.appendChild(res);
  function show(){
    res.innerHTML='';query=inp.value;
    if(!inp.value.trim())return;
    var found=search(inp.value);
    if(!found.length){res.appendChild(el('div','muted','لم نجد هذا الاسم. جرّب كتابة اسمك فقط، أو اختر حمولتك من الأسفل.'));return}
    found.forEach(function(x){res.appendChild(btn('',x.name,function(){go(x.path)},lineage(x,3)))});
  }
  inp.oninput=show;show();
  app.appendChild(sb);

  var hb=el('div','box');
  hb.appendChild(el('label',null,'أو اختر حمولتك'));
  var l=el('div','list');
  kidsOf(ROOT).forEach(function(c){l.appendChild(btn('',c.name,function(){go(c.path)},c.total?c.total+' اسمًا':'لم تُكتمل بعد'))});
  hb.appendChild(l);
  app.appendChild(hb);
}

function person(r){
  var top=el('div','top');
  var parent=r.path.slice(0,r.path.lastIndexOf(' / '));
  top.appendChild(btn('plain','→ رجوع إلى '+byPath[parent].name,function(){go(parent)}));
  top.appendChild(btn('plain','الصفحة الرئيسية',function(){query='';go(ROOT.path)}));
  app.appendChild(top);

  var a=A[r.path]||{},info=a.info||{};
  var card=el('div','box white');card.style.gap='14px';
  if(info.photo){var im=document.createElement('img');im.className='photo';im.src=info.photo;im.alt=r.name;card.appendChild(im)}
  card.appendChild(el('h1','big',r.name));
  if(r.chain.length>1)card.appendChild(el('div',null,lineage(r)));

  var facts=el('div','facts');
  function fact(k,v){var d=el('div');d.appendChild(el('b',null,k+':'));d.appendChild(el('span',null,v));facts.appendChild(d)}
  fact('عدد الأبناء',r.kids.length?String(r.kids.length):'لا يوجد أبناء مسجّلون');
  if(r.total>r.kids.length)fact('مجموع الذرية',String(r.total));
  if(info.birth)fact('سنة الميلاد',info.birth);
  if(info.death)fact('سنة الوفاة',info.death);
  if(info.city)fact('السكن',info.city);
  card.appendChild(facts);

  var links=[],h=function(v){return String(v).replace(/^@/,'')},tel=function(v){return String(v).replace(/[^0-9+]/g,'')};
  if(info.phone)links.push(['اتصال','tel:'+tel(info.phone)]);
  if(info.whatsapp||info.phone)links.push(['واتساب','https://wa.me/'+tel(info.whatsapp||info.phone).replace(/^\+/,'').replace(/^0/,'964')]);
  if(info.instagram)links.push(['انستقرام','https://instagram.com/'+h(info.instagram)]);
  if(info.telegram)links.push(['تلقرام','https://t.me/'+h(info.telegram)]);
  if(info.facebook)links.push(['فيسبوك',/^https?:/.test(info.facebook)?info.facebook:'https://facebook.com/'+h(info.facebook)]);
  if(info.email)links.push(['بريد','mailto:'+info.email]);
  if(links.length){var ch=el('div','chips');links.forEach(function(l){var x=el('a','chip',l[0]);x.href=l[1];x.target='_blank';x.rel='noopener';ch.appendChild(x)});card.appendChild(ch)}
  app.appendChild(card);

  if(r.kids.length){
    var kb=el('div','box');
    kb.appendChild(el('label',null,'أبناء '+r.name+' — اضغط على أي اسم'));
    var l=el('div','list');
    kidsOf(r).forEach(function(c){l.appendChild(btn('',c.name,function(){go(c.path)},c.kids.length?c.kids.length+' أبناء':''))});
    kb.appendChild(l);app.appendChild(kb);
  }

  var notes=(a.comments||[]);
  if(notes.length){
    var nb=el('div','box');
    nb.appendChild(el('label',null,'ملاحظات العائلة'));
    notes.forEach(function(c){var n=el('div','note'+(c.admin?' admin':''));n.appendChild(el('p',null,c.note));n.appendChild(el('div','who',(c.admin?'إدارة الشجرة':(c.by||''))+(c.at?' — '+String(c.at).slice(0,10):'')));nb.appendChild(n)});
    app.appendChild(nb);
  }

  var act=el('div','box');
  if(sent){
    act.appendChild(el('div','ok','✓ وصل طلبك، شكرًا لك. سنتواصل معك للتأكد قبل إضافته.'));
    act.appendChild(btn('plain center','إرسال طلب آخر',function(){sent=false;form=null;render()}));
    app.appendChild(act);return;
  }
  if(!form){
    act.appendChild(el('label',null,'هل لديك إضافة أو تصحيح؟'));
    act.appendChild(btn('main','أضف أبناءً لـ '+r.name,function(){form='kids';render()}));
    act.appendChild(btn('sage center','هذا الاسم فيه خطأ',function(){form='fix';render()}));
    act.appendChild(btn('plain center','أرسل ملاحظة',function(){form='note';render()}));
    var more=el('button','link','إضافة معلومات (سنة الميلاد، السكن، حسابات التواصل)');more.type='button';more.onclick=function(){form='info';render()};
    act.appendChild(more);
    app.appendChild(act);return;
  }
  drawForm(act,r);
  app.appendChild(act);
}

function field(box,lbl,id,ph,type,val){
  box.appendChild(el('label',null,lbl));
  var i=document.createElement(type==='area'?'textarea':'input');
  if(type!=='area')i.type=type||'text';
  if(type==='tel')i.inputMode='tel';
  i.id=id;i.placeholder=ph||'';if(val)i.value=val;
  box.appendChild(i);return i;
}

function drawForm(box,r){
  var titles={kids:'أضف أبناءً لـ '+r.name,fix:'تصحيح اسم «'+r.name+'»',note:'ملاحظة على «'+r.name+'»',info:'معلومات عن «'+r.name+'»'};
  box.appendChild(el('h2',null,titles[form]));

  if(form==='kids'){
    box.appendChild(el('div','muted','اكتب اسم كل ابن في خانة. الاسم وحده فقط، مثل: «حيدر».'));
    var wrap=el('div','list');box.appendChild(wrap);
    kids.forEach(function(k,i){
      var g=el('div');g.style.cssText='display:flex;flex-direction:column;gap:8px';
      var row=el('div','row2');
      var inp=document.createElement('input');inp.placeholder='اسم الابن';inp.value=k.name;inp.oninput=function(){k.name=inp.value};
      row.appendChild(inp);
      if(kids.length>1){var x=el('button','x','×');x.type='button';x.setAttribute('aria-label','حذف');x.onclick=function(){kids.splice(i,1);render()};row.appendChild(x)}
      g.appendChild(row);
      var sub=el('div','sub');
      k.kids.forEach(function(gk,j){
        var rr=el('div','row2');
        var gi=document.createElement('input');gi.placeholder='ابن '+(k.name||'هذا الابن');gi.value=gk;gi.oninput=function(){k.kids[j]=gi.value};
        rr.appendChild(gi);
        var gx=el('button','x','×');gx.type='button';gx.setAttribute('aria-label','حذف');gx.onclick=function(){k.kids.splice(j,1);render()};rr.appendChild(gx);
        sub.appendChild(rr);
      });
      var addG=btn('plain center','+ أبناء '+(k.name||'هذا الابن')+' (الأحفاد)',function(){k.kids.push('');render()});
      addG.style.minHeight='52px';addG.style.fontSize='17px';
      sub.appendChild(addG);
      g.appendChild(sub);
      wrap.appendChild(g);
    });
    box.appendChild(btn('plain center','+ ابن آخر',function(){kids.push({name:'',kids:[]});render()}));
  }
  if(form==='fix'){
    field(box,'الاسم الصحيح','fName','اكتب الاسم الصحيح');
    field(box,'توضيح (اختياري)','fNote','مثال: الاسم مكتوب خطأ، أو هذا الشخص ليس ابن '+(r.chain[r.chain.length-1]||''),'area');
  }
  if(form==='note'){
    field(box,'ملاحظتك','fNote','اكتب ما تريد إخبارنا به','area');
  }
  if(form==='info'){
    field(box,'سنة الميلاد','fBirth','مثال: 1985');
    field(box,'سنة الوفاة (إن وُجدت)','fDeath','');
    field(box,'مكان السكن','fCity','مثال: البصرة — الطويسة');
    field(box,'انستقرام (اختياري)','fInsta','@');
    field(box,'فيسبوك (اختياري)','fFb','');
    box.appendChild(el('div','muted','هذه المعلومات تظهر للعائلة بعد التأكد منها.'));
  }

  var me=el('div','box white');me.style.marginTop='6px';
  var saved={};try{saved={by:localStorage.getItem('family-tree-by')||'',ph:localStorage.getItem('family-tree-phone')||''}}catch(e){}
  var fb=field(me,'اسمك الثلاثي','fBy','مثال: اكرم علي لازم','text',saved.by);
  fb.oninput=function(){try{localStorage.setItem('family-tree-by',fb.value)}catch(e){}};
  var known=String(saved.ph||'').replace(/\D/g,'').length>=8&&!phoneEdit;
  if(known){
    var hp=document.createElement('input');hp.type='hidden';hp.id='fPhone';hp.value=saved.ph;me.appendChild(hp);
    var pr=el('div');pr.style.cssText='display:flex;flex-wrap:wrap;align-items:center;gap:8px';
    pr.appendChild(el('span',null,'رقمك محفوظ: '));
    var shown=el('b',null,saved.ph);shown.dir='ltr';pr.appendChild(shown);
    var ch=el('button','link','تغيير');ch.type='button';ch.onclick=function(){phoneEdit=true;render()};
    pr.appendChild(ch);
    me.appendChild(pr);
    me.appendChild(el('div','muted','لا حاجة لكتابته مرة أخرى على هذا الجهاز.'));
  }else{
    var fp=field(me,'رقم هاتفك','fPhone','07xxxxxxxxx','tel',saved.ph);
    fp.oninput=function(){try{localStorage.setItem('family-tree-phone',fp.value)}catch(e){}};
    me.appendChild(el('div','muted','رقمك لا يظهر لأحد. نستخدمه فقط للتواصل معك والتأكد، ويُحفظ على جهازك فلا تكتبه مرة أخرى.'));
  }
  box.appendChild(me);

  var msg=el('div','err');box.appendChild(msg);
  var send=btn('main','إرسال',function(){submit(r,msg,send)});box.appendChild(send);
  var cancel=el('button','link','إلغاء');cancel.type='button';cancel.onclick=function(){form=null;render()};
  box.appendChild(cancel);
}

function cleanName(raw,anc){
  var w=String(raw||'').replace(PHONE_RE,' ').replace(/\s+/g,' ').trim();if(!w)return '';
  var parts=w.split(' '),A=anc.map(nz),cut=parts.length;
  for(var i=1;i<parts.length;i++){if(A.indexOf(nz(parts[i]).replace(/^ال/,''))!==-1||A.indexOf(nz(parts[i]))!==-1||parts[i]==='بن'){cut=i;break}}
  return parts.slice(0,cut).join(' ');
}
function splitNames(raw){return String(raw||'').split(/\s*[،,؛;\n]\s*|\s+و\s+/).map(function(s){return s.trim()}).filter(Boolean)}
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}

function submit(r,msg,b){
  var by=v('fBy').replace(PHONE_RE,' ').replace(/\s+/g,' ').trim();
  var phone=v('fPhone');
  if(!by){msg.textContent='اكتب اسمك';return}
  if(phone.replace(/\D/g,'').length<8){msg.textContent='اكتب رقم هاتفك';return}
  var p={path:r.path,by:by,note:''};
  var anc=[r.name].concat(r.chain.slice().reverse());
  if(form==='kids'){
    var out=[],seen={};
    kids.forEach(function(k){
      var names=splitNames(k.name);
      names.forEach(function(nm,i){
        var n=cleanName(nm,anc);if(!n||seen[n])return;seen[n]=1;
        var g=[];
        if(i===names.length-1)k.kids.forEach(function(x){splitNames(x).forEach(function(y){var c=cleanName(y,[n].concat(anc));if(c&&g.indexOf(c)===-1)g.push(c)})});
        out.push({name:n,kids:g});
      });
    });
    if(!out.length){msg.textContent='اكتب اسم ابن واحد على الأقل';return}
    p.type='correction';p.kids=out;p.name=out.map(function(k){return k.name}).join('، ');
  }else if(form==='fix'){
    if(!v('fName')){msg.textContent='اكتب الاسم الصحيح';return}
    p.type='comment';p.note='تصحيح اسم: «'+r.name+'» ← «'+v('fName')+'»'+(v('fNote')?'\n'+v('fNote'):'');
  }else if(form==='note'){
    if(!v('fNote')){msg.textContent='اكتب ملاحظتك';return}
    p.type='comment';p.note=v('fNote');
  }else{
    p.type='info';p.birth=v('fBirth');p.death=v('fDeath');p.city=v('fCity');p.instagram=v('fInsta');p.facebook=v('fFb');
    if(!p.birth&&!p.death&&!p.city&&!p.instagram&&!p.facebook){msg.textContent='اكتب معلومة واحدة على الأقل';return}
  }
  try{localStorage.setItem('family-tree-by',by);localStorage.setItem('family-tree-phone',phone)}catch(e){}
  msg.textContent='';b.disabled=true;b.firstChild.textContent='جارٍ الإرسال…';
  fetch(PRIV_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({by:by,path:r.path,phone:phone})}).catch(function(){});
  fetch(HOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
    .then(function(res){if(!res.ok)throw 0;sent=true;form=null;kids=[{name:'',kids:[]}];render()})
    .catch(function(){b.disabled=false;b.firstChild.textContent='إرسال';msg.textContent='لم يُرسل — تأكد من الإنترنت وحاول مرة أخرى'});
}

fetch(TREE_URL+'?t='+Date.now()).then(function(r){return r.json()}).then(function(t){
  build(t);
  var h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  sel=byPath[h]?h:ROOT.path;
  render();
  return fetch(DATA_URL+'?t='+Date.now()).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.approved){A=j.approved;if(!form)render()}});
}).catch(function(){app.innerHTML='<p class="muted" style="text-align:center">تعذّر تحميل الشجرة — تأكد من الإنترنت ثم أعد فتح الصفحة.</p>'});
</script>
